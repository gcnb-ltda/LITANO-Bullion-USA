<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | LITANO Bullion</title><link rel="stylesheet" href="assets/css/main.css"></head><body><header><a class="brand" href="index.html"><span class="seal">L</span><span>LITANO<small>BULLION</small></span></a><nav><a href="store.html">STORE</a><a href="store.html?metal=gold">GOLD</a><a href="store.html?metal=silver">SILVER</a></nav><div class="actions"><a class="cart" href="cart.html">CART <span id="cartCount">0</span></a></div></header><main class="section"><div class="kicker">SECURE ORDER REQUEST</div><h2>Your Cart</h2><div id="cartItems" style="margin:35px 0"></div><a class="btn primary" href="store.html">CONTINUE SHOPPING</a></main><script src="assets/js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=getCart(),e=document.getElementById('cartItems');if(!c.length){e.innerHTML='<p>Your cart is empty.</p>';return}e.innerHTML=c.map(i=>{let p=products.find(x=>x.id===i.id);return `<div style="padding:20px 0;border-bottom:1px solid #d8d3c8"><b>${p.name}</b><span style="float:right">Quantity: ${i.qty}</span><br><small>${p.metal} · ${p.weight} · Final price on confirmation</small></div>`}).join('')+'<p style="margin-top:30px">Checkout and live payment processing will require an approved payment provider/backend. No card data is collected by this static GitHub Pages version.</p>'});</script></body></html>
